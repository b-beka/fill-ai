[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fill-ai-backend"
version = "0.1.0"
description = "Backend service for automated lecture summaries, keyframes, quizzes, and reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis[hiredis]>=5.0.4",
    "boto3>=1.34.0",
    "aioboto3>=13.0.0",
    "sse-starlette>=2.1.2",
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.7",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "google-genai>=0.1.1",
    "livekit-api>=0.6.0",
    "pillow>=10.3.0",
    "opencv-python-headless>=4.9.0.80",
    "imagehash>=4.3.1",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
